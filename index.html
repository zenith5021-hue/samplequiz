<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칠판 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  /* ============================================================
     설정: 구글 시트를 "파일 > 공유 > 웹에 게시 > CSV"로 게시한 뒤,
     아래 SHEET_CSV_URL 값을 그 주소로 바꿔주세요.
     ============================================================ */
  :root{
    --board:#1e3a2f;
    --board-dark:#152a22;
    --frame:#6b4a32;
    --frame-dark:#4d3423;
    --chalk-white:#f5f3e8;
    --chalk-yellow:#f2c572;
    --chalk-pink:#e8879a;
    --chalk-blue:#8fc4c0;
    --chalk-red:#e2726b;
    --chalk-green:#93c47d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,0.03), transparent 40%),
      var(--board);
    font-family:'Nanum Gothic', sans-serif;
    color:var(--chalk-white);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }
  .frame{
    width:100%;
    max-width:640px;
    background:var(--frame);
    border-radius:14px;
    padding:14px;
    box-shadow:0 18px 40px rgba(0,0,0,0.45), inset 0 0 0 3px var(--frame-dark);
  }
  .board{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 2px, transparent 4px),
      var(--board-dark);
    border-radius:8px;
    padding:28px 24px;
    min-height:420px;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  h1{
    font-family:'Gaegu', cursive;
    font-size:1.9rem;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:1px;
    text-shadow:0 0 2px rgba(245,243,232,0.35);
  }
  .subtitle{
    text-align:center;
    font-size:0.82rem;
    opacity:0.55;
    margin-bottom:18px;
  }
  /* 진행 표시: 분필 눈금 */
  .tally{
    display:flex;
    gap:6px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .tally span{
    width:22px;height:6px;border-radius:3px;
    background:rgba(245,243,232,0.15);
    transition:background 0.25s;
  }
  .tally span.done{background:var(--chalk-yellow);}
  .tally span.now{background:var(--chalk-white);}

  .qbox{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .qnum{
    font-family:'Gaegu', cursive;
    color:var(--chalk-yellow);
    font-size:0.95rem;
    margin-bottom:6px;
  }
  .question{
    font-size:1.25rem;
    font-weight:800;
    line-height:1.5;
    margin-bottom:22px;
    word-break:keep-word;
  }
  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice-btn{
    background:transparent;
    border:2px dashed rgba(245,243,232,0.45);
    color:var(--chalk-white);
    font-family:'Nanum Gothic', sans-serif;
    font-size:1rem;
    font-weight:700;
    padding:13px 16px;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    transition:transform 0.12s, border-color 0.15s, background 0.15s;
  }
  .choice-btn:hover:not(:disabled){
    border-color:var(--chalk-white);
    background:rgba(245,243,232,0.06);
    transform:translateX(2px);
  }
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{
    border-color:var(--chalk-green);
    background:rgba(147,196,125,0.15);
    color:var(--chalk-green);
  }
  .choice-btn.wrong{
    border-color:var(--chalk-red);
    background:rgba(226,114,107,0.15);
    color:var(--chalk-red);
  }

  .short-answer{display:flex;gap:10px;flex-wrap:wrap;}
  .short-answer input{
    flex:1;
    min-width:160px;
    background:transparent;
    border:none;
    border-bottom:2px dashed rgba(245,243,232,0.5);
    color:var(--chalk-white);
    font-family:'Nanum Gothic', sans-serif;
    font-size:1.05rem;
    padding:8px 4px;
    outline:none;
  }
  .short-answer input:focus{border-bottom-color:var(--chalk-yellow);}
  .short-answer input:disabled{opacity:0.7;}
  .btn{
    font-family:'Gaegu', cursive;
    font-size:1.05rem;
    font-weight:700;
    background:var(--chalk-yellow);
    color:var(--board-dark);
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    transition:transform 0.1s, filter 0.15s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn.ghost{
    background:transparent;
    color:var(--chalk-white);
    border:2px dashed rgba(245,243,232,0.45);
  }

  .feedback{
    margin-top:16px;
    padding:12px 14px;
    border-radius:8px;
    font-size:0.92rem;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(147,196,125,0.12);border-left:3px solid var(--chalk-green);}
  .feedback.no{background:rgba(226,114,107,0.12);border-left:3px solid var(--chalk-red);}
  .feedback b{font-family:'Gaegu', cursive;font-size:1rem;}

  .footer-row{
    display:flex;
    justify-content:flex-end;
    margin-top:18px;
  }

  .center-msg{
    text-align:center;
    font-family:'Gaegu', cursive;
    font-size:1.1rem;
    opacity:0.8;
    margin:auto;
  }
  .center-msg .sub{
    font-family:'Nanum Gothic', sans-serif;
    font-size:0.85rem;
    opacity:0.65;
    margin-top:10px;
    line-height:1.6;
  }
  .center-msg code{
    background:rgba(245,243,232,0.1);
    padding:2px 6px;
    border-radius:4px;
    font-size:0.8rem;
  }

  .result-score{
    font-family:'Gaegu', cursive;
    font-size:3rem;
    text-align:center;
    color:var(--chalk-yellow);
    margin:10px 0 4px;
  }
  .result-label{text-align:center;opacity:0.7;margin-bottom:26px;font-size:0.9rem;}
  .result-actions{display:flex;justify-content:center;gap:10px;}

  .chalk-tray{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
  }
  .chalk-tray div{
    width:34px;height:9px;border-radius:5px;
  }
  .spinner{
    width:26px;height:26px;
    border:3px solid rgba(245,243,232,0.2);
    border-top-color:var(--chalk-yellow);
    border-radius:50%;
    margin:0 auto 14px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="frame">
  <div class="board" id="board">
    <h1>📋 오늘의 퀴즈</h1>
    <div class="subtitle">칠판을 채워볼까요?</div>
    <div id="content" class="qbox"></div>
  </div>
  <div class="chalk-tray">
    <div style="background:var(--chalk-white)"></div>
    <div style="background:var(--chalk-yellow)"></div>
    <div style="background:var(--chalk-pink)"></div>
    <div style="background:var(--chalk-blue)"></div>
  </div>
</div>

<script>
/* ============================================================
   여기에 게시한 구글 시트 CSV 주소를 넣어주세요.
   구글 시트 > 파일 > 공유 > 웹에 게시 > 형식: CSV > 게시
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQYOcU9_i96yfQzJCBmw8pNdmvDKiJWexB2IkDKL9G0xWL3cJXmkGFUR83uA5GRGiFhKc_HhhlzmPuS/pub?gid=577983572&single=true&output=csv";

const contentEl = document.getElementById('content');

let quiz = [];
let order = [];
let idx = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderSetupMessage(){
  contentEl.innerHTML = `
    <div class="center-msg">
      🖍️ 아직 시트가 연결되지 않았어요<br>
      <div class="sub">
        1. 구글 시트에서 <b>파일 → 공유 → 웹에 게시</b><br>
        2. 형식을 <b>CSV</b>로 선택 후 게시<br>
        3. 생성된 주소를 이 파일 상단의<br>
        <code>SHEET_CSV_URL</code> 값에 붙여넣기
      </div>
    </div>`;
}

function renderLoading(){
  contentEl.innerHTML = `
    <div class="center-msg">
      <div class="spinner"></div>
      칠판 닦는 중...
    </div>`;
}

function renderError(msg){
  contentEl.innerHTML = `
    <div class="center-msg">
      😥 문제를 불러오지 못했어요<br>
      <div class="sub">${msg}</div>
    </div>`;
}

async function loadQuiz(){
  if(!SHEET_CSV_URL || SHEET_CSV_URL.includes("PASTE_YOUR")){
    renderSetupMessage();
    return;
  }
  renderLoading();
  try{
    const res = await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error("시트 응답 오류 (" + res.status + ")");
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    quiz = parsed.data.map(row => ({
      type: (row['유형']||'').trim(),
      question: (row['문제']||'').trim(),
      choices: [row['선택지1'],row['선택지2'],row['선택지3'],row['선택지4']]
        .map(c=>(c||'').trim()).filter(Boolean),
      answer: (row['정답']||'').trim(),
      explanation: (row['해설']||'').trim()
    })).filter(q => q.question && q.answer);

    if(quiz.length === 0){
      renderError("시트에서 문제를 하나도 찾지 못했어요. 열 이름(유형/문제/선택지1~4/정답/해설)을 확인해주세요.");
      return;
    }
    startQuiz();
  }catch(e){
    renderError(e.message + " — 시트가 '웹에 게시' 상태인지, 주소가 정확한지 확인해주세요.");
  }
}

function startQuiz(){
  order = shuffle(quiz.map((_,i)=>i));
  idx = 0;
  score = 0;
  answered = false;
  renderQuestion();
}

function renderTally(){
  let html = '<div class="tally">';
  order.forEach((_,i)=>{
    let cls = '';
    if(i < idx) cls = 'done';
    else if(i === idx) cls = 'now';
    html += `<span class="${cls}"></span>`;
  });
  html += '</div>';
  return html;
}

function renderQuestion(){
  answered = false;
  const q = quiz[order[idx]];
  let body = '';

  if(q.type === '단답형' || q.choices.length === 0){
    body = `
      <div class="short-answer">
        <input type="text" id="sa-input" placeholder="정답을 입력하세요" autocomplete="off">
        <button class="btn" id="sa-submit">확인</button>
      </div>`;
  }else{
    body = '<div class="choices">' + q.choices.map((c,i)=>
      `<button class="choice-btn" data-i="${i}">${c}</button>`
    ).join('') + '</div>';
  }

  contentEl.innerHTML = `
    ${renderTally()}
    <div class="qnum">문제 ${idx+1} / ${order.length}</div>
    <div class="question">${q.question}</div>
    ${body}
    <div class="feedback" id="feedback"></div>
    <div class="footer-row"><button class="btn ghost" id="next-btn" style="display:none;">다음 문제 →</button></div>
  `;

  if(q.type === '단답형' || q.choices.length === 0){
    const input = document.getElementById('sa-input');
    const submit = document.getElementById('sa-submit');
    const submitFn = () => checkShortAnswer(input.value, q);
    submit.addEventListener('click', submitFn);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submitFn(); });
  }else{
    document.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.addEventListener('click', () => checkChoice(btn, q));
    });
  }
  document.getElementById('next-btn').addEventListener('click', nextQuestion);
}

function showFeedback(isCorrect, q){
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'no');
  fb.innerHTML = (isCorrect ? '<b>✓ 정답이에요!</b>' : `<b>✗ 아쉬워요.</b> 정답: ${q.answer.split('/')[0]}`)
    + (q.explanation ? `<br>${q.explanation}` : '');
  document.getElementById('next-btn').style.display = 'inline-block';
}

function checkChoice(btn, q){
  if(answered) return;
  answered = true;
  const chosen = btn.textContent.trim();
  const isCorrect = chosen === q.answer;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent.trim() === q.answer) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  if(isCorrect) score++;
  showFeedback(isCorrect, q);
}

function checkShortAnswer(value, q){
  if(answered) return;
  answered = true;
  const accepted = q.answer.split('/').map(a=>a.trim().toLowerCase());
  const isCorrect = accepted.includes(value.trim().toLowerCase());
  document.getElementById('sa-input').disabled = true;
  document.getElementById('sa-submit').disabled = true;
  if(isCorrect) score++;
  showFeedback(isCorrect, q);
}

function nextQuestion(){
  idx++;
  if(idx >= order.length) renderResult();
  else renderQuestion();
}

function renderResult(){
  const pct = Math.round((score/order.length)*100);
  contentEl.innerHTML = `
    <div class="center-msg" style="margin:auto 0;">
      <div style="font-size:2.2rem;">🎉</div>
    </div>
    <div class="result-score">${score} / ${order.length}</div>
    <div class="result-label">정답률 ${pct}%</div>
    <div class="result-actions">
      <button class="btn" id="retry-btn">다시 풀기</button>
    </div>
  `;
  document.getElementById('retry-btn').addEventListener('click', startQuiz);
}

loadQuiz();
</script>
</body>
</html>
